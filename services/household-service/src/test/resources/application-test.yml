spring:
  datasource:
    url: jdbc:h2:mem:household_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

grpc:
  server:
    port: -1
    in-process-name: household-test-grpc

homecare:
  internal:
    workload-token: test-internal-token
  maintenance:
    poll-ms: 3600000
