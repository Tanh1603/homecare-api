spring:
  datasource:
    url: jdbc:h2:mem:booking_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

grpc:
  server:
    port: -1
    in-process-name: booking-test-grpc
  client:
    providerService:
      address: in-process:booking-test-grpc
      negotiationType: PLAINTEXT
    householdService:
      address: in-process:booking-test-grpc
      negotiationType: PLAINTEXT

homecare:
  internal:
    workload-token: test-internal-token
  household:
    base-url: http://localhost:18082
