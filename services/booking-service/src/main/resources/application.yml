server:
  port: ${SERVER_PORT:8084}

grpc:
  server:
    port: ${BOOKING_GRPC_PORT:9084}
  client:
    providerService:
      address: ${PROVIDER_GRPC_ADDRESS:static://localhost:9083}
      negotiationType: PLAINTEXT
    householdService:
      address: ${HOUSEHOLD_GRPC_ADDRESS:static://localhost:9082}
      negotiationType: PLAINTEXT

spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DB_USER:keycloak}
    password: ${DB_PASSWORD:change_me_local_pg_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:homecare}
    password: ${RABBITMQ_DEFAULT_PASS:123456}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/homecare/protocol/openid-connect/certs}

homecare:
  internal:
    workload-token: ${INTERNAL_WORKLOAD_TOKEN:change_me_internal_workload_token}
  household:
    base-url: ${HOUSEHOLD_INTERNAL_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
