server:
    port: ${SERVER_PORT:8080}

spring:
    application:
        name: gateway-service

    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

    cloud:
        gateway:
            routes:
                - id: keycloak-auth-route
                  uri: ${KEYCLOAK_URL}
                  predicates:
                      - Path=/api/v1/auth/**
                  filters:
                      - RewritePath=/api/v1/auth/(?<segment>.*), /realms/${KEYCLOAK_REALM}/protocol/openid-connect/$\{segment}

                - id: user-service-route
                  uri: ${USER_SERVICE_URL}
                  predicates:
                      - Path=/api/v1/users/**
                  filters:
                      - name: CircuitBreaker
                        args:
                            name: userServiceCB
                            fallbackUri: forward:/fallback/services

resilience4j:
    circuitbreaker:
        configs:
            default:
                slidingWindowSize: 20
                failureRateThreshold: 50
                waitDurationInOpenState: 10s

app:
    cors:
        allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
