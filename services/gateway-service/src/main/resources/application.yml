server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: household-service-route
              uri: ${HOUSEHOLD_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/households,/api/v1/households/**,/api/v1/devices,/api/v1/devices/**,/api/v1/warranties/**,/api/v1/maintenance-schedules/**,/api/v1/care-history/**,/api/v1/admin/device-types/**
            - id: review-service-route
              uri: ${REVIEW_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/service-reviews,/api/v1/service-reviews/**,/api/v1/providers/*/service-reviews,/api/v1/products/*/reviews
            - id: provider-service-route
              uri: ${PROVIDER_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/services,/api/v1/services/**,/api/v1/providers,/api/v1/providers/**,/api/v1/technicians,/api/v1/technicians/**,/api/v1/admin/providers/**,/api/v1/admin/technicians/**,/api/v1/admin/service-categories/**
            - id: booking-service-route
              uri: ${BOOKING_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/bookings,/api/v1/bookings/**,/api/v1/assignment-operations/**
            - id: commerce-service-route
              uri: ${COMMERCE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/merchant/**,/api/v1/orders,/api/v1/orders/**,/api/v1/payments/vnpay/ipn,/api/v1/admin/product-categories/**
            - id: notification-service-route
              uri: ${NOTIFICATION_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**,/api/v1/notification-devices,/api/v1/notification-devices/**
            - id: household-service-v3-docs
              uri: ${HOUSEHOLD_URL:http://localhost:8082}
              predicates:
                - Path=/household-service/v3/api-docs,/household-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: provider-service-v3-docs
              uri: ${PROVIDER_URL:http://localhost:8083}
              predicates:
                - Path=/provider-service/v3/api-docs,/provider-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: booking-service-v3-docs
              uri: ${BOOKING_URL:http://localhost:8084}
              predicates:
                - Path=/booking-service/v3/api-docs,/booking-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: commerce-service-v3-docs
              uri: ${COMMERCE_URL:http://localhost:8085}
              predicates:
                - Path=/commerce-service/v3/api-docs,/commerce-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: review-service-v3-docs
              uri: ${REVIEW_URL:http://localhost:8086}
              predicates:
                - Path=/review-service/v3/api-docs,/review-service/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: notification-service-v3-docs
              uri: ${NOTIFICATION_URL:http://localhost:8087}
              predicates:
                - Path=/notification-service/v3/api-docs,/notification-service/v3/api-docs/**
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:3000
                  - http://localhost:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Origin
                  - X-Requested-With
                  - X-Correlation-Id
                  - If-Match
                  - Idempotency-Key
                exposed-headers:
                  - Authorization
                  - Content-Disposition
                  - X-Correlation-Id
                  - ETag
                allow-credentials: true
                max-age: 3600
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Household Service
        url: /household-service/v3/api-docs
      - name: Provider Service
        url: /provider-service/v3/api-docs
      - name: Booking Service
        url: /booking-service/v3/api-docs
      - name: Commerce Service
        url: /commerce-service/v3/api-docs
      - name: Review Service
        url: /review-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs
