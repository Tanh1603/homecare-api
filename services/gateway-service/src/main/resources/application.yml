server:
  port: ${SERVER_PORT}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
          issuer-uri: ${KEYCLOAK_ISSUER_URI}


  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service-route
              uri: ${IDENTITY_URL}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: identity-service-v3-docs
              uri: ${IDENTITY_URL}
              predicates:
                - Path=/identity-service/v3/api-docs,/identity-service/v3/api-docs/**
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                # Nhận danh sách domain qua biến môi trường CORS_ALLOWED_ORIGINS, phân tách bởi dấu phẩy
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Origin
                  - X-Requested-With
                exposed-headers:
                  - Authorization
                  - Content-Disposition
                allow-credentials: true
                max-age: 3600
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Identity Service
        url: /identity-service/v3/api-docs
      # - name: Service Request Service
      #   url: /service-request-service/v3/api-docs
