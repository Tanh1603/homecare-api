server:
  port: ${SERVER_PORT}

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service-route
              uri: ${IDENTITY_URL}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: identity-service-v3-docs
              uri: ${IDENTITY_URL}
              predicates:
                - Path=/identity-service/v3/api-docs,/identity-service/v3/api-docs/**
              filters:
                - StripPrefix=1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Identity Service
        url: /identity-service/v3/api-docs
      # - name: Service Request Service
      #   url: /service-request-service/v3/api-docs