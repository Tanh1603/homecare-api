server:
    port: 8081

spring:
    application:
        name: identity-service
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

keycloak:
    base-url: ${KEYCLOAK_URL}
    realm: ${KEYCLOAK_REALM}
    admin-username: ${KEYCLOAK_ADMIN} # dev only, prod dùng service-account
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

webhook:
    secret: ${WEBHOOK_SECRET}
