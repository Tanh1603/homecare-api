server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  messages:
    basename: messages
    encoding: UTF-8
  web:
    locale: en_US
    locale-resolver: fixed
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
keycloak:
  server-url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  token-scope: ${KEYCLOAK_TOKEN_SCOPE:openid profile email roles}
  default-role: ${KEYCLOAK_DEFAULT_ROLE:CUSTOMER}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}