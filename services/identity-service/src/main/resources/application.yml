spring:
  application:
    name: "identity-service"
  jmx:
    enabled: "false"
  mvc:
    log-request-details: "false"
  jackson:
    deserialization:
      fail-on-unknown-properties: "true"
  jpa:
    open-in-view: "false"
    show-sql: "false"
    hibernate:
      ddl-auto: "validate"
  sql:
    init:
      mode: "never"
  liquibase:
    enabled: "false"
  datasource:
    url: "${DATABASE_URL:${DB_URL}}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  ssl:
    bundle:
      jks:
        workload:
          keystore:
            location: "${TLS_KEYSTORE}"
            password: "${TLS_KEYSTORE_PASSWORD}"
            type: "PKCS12"
          truststore:
            location: "${TLS_TRUSTSTORE}"
            password: "${TLS_TRUSTSTORE_PASSWORD}"
            type: "PKCS12"
  web:
    error:
      include-message: "never"
      include-stacktrace: "never"
      include-binding-errors: "never"
management:
  endpoints:
    web:
      exposure:
        include: "health"
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: "never"
      show-components: "never"
      probes:
        enabled: "true"
      group:
        readiness:
          include: "readinessState,db"
server:
  address: "${SERVER_ADDRESS:127.0.0.1}"
  port: "${SERVER_PORT:8080}"
  ssl:
    enabled: "true"
    bundle: "workload"
    client-auth: "need"
logging:
  level:
    org:
      springframework:
        web: "INFO"
      hibernate:
        SQL: "OFF"
        orm:
          jdbc:
            bind: "OFF"
    com:
      zaxxer:
        hikari: "INFO"
homecare:
  security:
    allowed-workloads: "gateway,identity,booking,provider,household,commerce,review,notification"
  firebase:
    project-id: "${FIREBASE_PROJECT_ID}"
    connect-timeout-ms: "${FIREBASE_CONNECT_TIMEOUT_MS:2000}"
    read-timeout-ms: "${FIREBASE_READ_TIMEOUT_MS:5000}"
  identity:
    idempotency-cleanup-interval-ms: "${IDEMPOTENCY_CLEANUP_INTERVAL_MS:60000}"
