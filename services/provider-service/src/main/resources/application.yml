server:
    port: ${SERVER_PORT:8083}
    forward-headers-strategy: framework

grpc:
    server:
        port: ${PROVIDER_GRPC_PORT:9083}

spring:
    application:
        name: provider-service
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/provider_db}
        username: ${DB_USER:postgres}
        password: ${DB_PASSWORD:change_me_local_pg_password}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_DEFAULT_USER:homecare}
        password: ${RABBITMQ_DEFAULT_PASS:123456}
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${SUPABASE_JWKS_URI:https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}

homecare:
    internal:
        workload-token: ${INTERNAL_WORKLOAD_TOKEN:change_me_internal_workload_token}
    security:
        enforce-gateway: ${HOMECARE_SECURITY_ENFORCE_GATEWAY:false}
        internal-gateway-secret: ${INTERNAL_GATEWAY_SECRET:homecare-internal-secret-2026}
    organization:
        outbox-poll-ms: ${ORGANIZATION_OUTBOX_POLL_MS:5000}

supabase:
    url: ${SUPABASE_URL:https://placeholder.supabase.co}
    secret-key: ${SUPABASE_SECRET_KEY:placeholder-secret-key}
    organization-role-id: ${SUPABASE_ORGANIZATION_ROLE_ID:00000000-0000-0000-0001-000000000002}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        enabled: false

management:
    endpoints:
        web:
            exposure:
                include: health,info
