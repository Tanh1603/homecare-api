server:
    port: ${SERVER_PORT:8086}

grpc:
    client:
        bookingService:
            address: ${BOOKING_GRPC_ADDRESS:static://localhost:9084}
            negotiationType: PLAINTEXT
        commerceService:
            address: ${COMMERCE_GRPC_ADDRESS:static://localhost:9085}
            negotiationType: PLAINTEXT

spring:
    application:
        name: review-service
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/review_db}
        username: ${DB_USER:keycloak}
        password: ${DB_PASSWORD:change_me_local_pg_password}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_DEFAULT_USER:homecare}
        password: ${RABBITMQ_DEFAULT_PASS:123456}
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/homecare/protocol/openid-connect/certs}

homecare:
    internal:
        workload-token: ${INTERNAL_WORKLOAD_TOKEN:change_me_internal_workload_token}
    booking:
        base-url: ${BOOKING_INTERNAL_URL:http://localhost:8084}
    commerce:
        base-url: ${COMMERCE_INTERNAL_URL:http://localhost:8085}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health,info
