server:
    port: ${SERVER_PORT:8087}

spring:
    application:
        name: notification-service
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
        username: ${DB_USER:postgres}
        password: ${DB_PASSWORD:change_me_local_pg_password}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_DEFAULT_USER:homecare}
        password: ${RABBITMQ_DEFAULT_PASS:123456}
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: ${SUPABASE_JWKS_URI:https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}

homecare:
    fcm:
        credentials-json: ${FCM_CREDENTIALS_JSON:}
        credentials-path: ${FCM_CREDENTIALS_PATH:}

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health,info
