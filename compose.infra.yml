name: homecare-ifra
services:
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - shared

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      - start-dev
      - --import-realm
    env_file:
      - .env
    ports:
      - "9090:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  shared:
    external: true
    name: homecare-shared