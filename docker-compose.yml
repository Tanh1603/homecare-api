services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d userdb"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 9090
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    ports: ["9090:8080"]
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      - ./keycloak/providers:/opt/keycloak/providers   # jar plugin webhook

  user-service:
    build: ./user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      KEYCLOAK_URL: http://keycloak:9090
      WEBHOOK_SECRET: change-me-please
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["8081"]            # chỉ nội bộ

  gateway:
    build: ./gateway
    environment:
      KEYCLOAK_URL: http://keycloak:9090
      USER_SERVICE_URL: http://user-service:8081
      REDIS_HOST: redis
    ports: ["8080:8080"]        # entry point duy nhất
    depends_on: [redis, user-service, keycloak]