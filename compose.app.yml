name: homecare-backend
services:
  household-service:
    container_name: household-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: household-service
    image: homecare/household-service:dev
    env_file:
      - ./services/household-service/.env
    environment:
      HOMECARE_SECURITY_ENFORCE_GATEWAY: "true"
      INTERNAL_GATEWAY_SECRET: "homecare-internal-secret-2026"
    expose:
      - "8082"
      - "9082"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 256M
    networks:
      - shared

  provider-service:
    container_name: provider-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: provider-service
    image: homecare/provider-service:dev
    env_file:
      - ./services/provider-service/.env
    environment:
      HOMECARE_SECURITY_ENFORCE_GATEWAY: "true"
      INTERNAL_GATEWAY_SECRET: "homecare-internal-secret-2026"
    expose:
      - "8083"
    ports:
      - "9083:9083"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 256M
    networks:
      - shared

  booking-service:
    container_name: booking-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: booking-service
    image: homecare/booking-service:dev
    env_file:
      - ./services/booking-service/.env
    environment:
      HOMECARE_SECURITY_ENFORCE_GATEWAY: "true"
      INTERNAL_GATEWAY_SECRET: "homecare-internal-secret-2026"
    expose:
      - "8084"
      - "9084"
    depends_on:
      - provider-service
      - household-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 256M
    networks:
      - shared

  commerce-service:
    container_name: commerce-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: commerce-service
    image: homecare/commerce-service:dev
    env_file:
      - ./services/commerce-service/.env
    environment:
      HOMECARE_SECURITY_ENFORCE_GATEWAY: "true"
      INTERNAL_GATEWAY_SECRET: "homecare-internal-secret-2026"
    expose:
      - "8085"
      - "9085"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 256M
    networks:
      - shared

  review-service:
    container_name: review-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: review-service
    image: homecare/review-service:dev
    env_file:
      - ./services/review-service/.env
    environment:
      HOMECARE_SECURITY_ENFORCE_GATEWAY: "true"
      INTERNAL_GATEWAY_SECRET: "homecare-internal-secret-2026"
    expose:
      - "8086"
    depends_on:
      - booking-service
      - commerce-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 256M
    networks:
      - shared

  notification-service:
    container_name: notification-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    image: homecare/notification-service:dev
    env_file:
      - ./services/notification-service/.env
    environment:
      HOMECARE_SECURITY_ENFORCE_GATEWAY: "true"
      INTERNAL_GATEWAY_SECRET: "homecare-internal-secret-2026"
    expose:
      - "8087"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 256M
    networks:
      - shared

  gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway-service
    image: homecare/gateway-service:dev
    env_file:
      - ./services/gateway-service/.env
    environment:
      INTERNAL_GATEWAY_SECRET: "homecare-internal-secret-2026"
    ports:
      - "8080:8080"
    depends_on:
      - household-service
      - provider-service
      - booking-service
      - commerce-service
      - review-service
      - notification-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 400M
        reservations:
          cpus: '0.10'
          memory: 200M
    networks:
      - shared

networks:
  shared:
    external: true
    name: homecare-shared
