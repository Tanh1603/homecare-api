syntax = "proto3";

package homecare.household.v1;

option java_multiple_files = true;
option java_package = "com.homecare.household.v1";
option java_outer_classname = "HouseholdServiceProto";

service HouseholdVerificationService {
  rpc VerifyDeviceReference (VerifyDeviceReferenceRequest) returns (VerifyDeviceReferenceResponse);
  rpc VerifyWarranty (VerifyWarrantyRequest) returns (VerifyWarrantyResponse);
}

message VerifyDeviceReferenceRequest {
  string device_id = 1;
  string requester_profile_id = 2;
}

message VerifyDeviceReferenceResponse {
  bool valid = 1;
  string device_id = 2;
  string household_id = 3;
  string device_type = 4;
  string device_name = 5;
  string status = 6;
}

message VerifyWarrantyRequest {
  string warranty_id = 1;
  string requester_profile_id = 2;
}

message VerifyWarrantyResponse {
  bool valid = 1;
  bool expired = 2;
  string warranty_id = 3;
  string device_id = 4;
  string device_type = 5;
  string organization_id = 6;
  string provider_name = 7;
  string ends_on_iso = 8;
  string status = 9;
}
