plugins {
	id 'org.springframework.boot' version '4.1.2' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
	mapstructVersion = '1.6.3'
	lombokMapstructBindingVersion = '0.2.0'
}

allprojects {
	group = 'com.homecare'
	version = '0.1.0-SNAPSHOT'
	repositories {
		mavenCentral()
	}
}

configure(subprojects.findAll { it.path.startsWith(':libs:') }) {
	layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("libs/${project.name}"))
}

configure(subprojects.findAll { it.path.startsWith(':services:') }) {
	apply plugin: 'java'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("services/${project.name}"))

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	sourceSets {
		integrationTest {
			java.srcDir 'src/integrationTest/java'
			resources.srcDir 'src/integrationTest/resources'
			compileClasspath += sourceSets.main.output + sourceSets.test.output
			runtimeClasspath += sourceSets.main.output + sourceSets.test.output
		}
	}

	configurations {
		integrationTestImplementation.extendsFrom testImplementation
		integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}

	tasks.register('integrationTest', Test) {
		description = 'Runs Testcontainers PostgreSQL and RabbitMQ integration tests.'
		group = 'verification'
		testClassesDirs = sourceSets.integrationTest.output.classesDirs
		classpath = sourceSets.integrationTest.runtimeClasspath
		shouldRunAfter tasks.named('test')
	}

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
        testImplementation("org.springframework.security:spring-security-test")
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
		integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
		integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
		integrationTestImplementation 'org.testcontainers:testcontainers-rabbitmq'
	}
}

tasks.register('integrationTest') {
	description = 'Runs PostgreSQL and RabbitMQ Testcontainers integration tests across domain services.'
	group = 'verification'
	dependsOn(
		':services:provider-service:integrationTest',
		':services:booking-service:integrationTest',
		':services:commerce-service:integrationTest',
		':services:household-service:integrationTest',
		':services:review-service:integrationTest',
		':services:notification-service:integrationTest'
	)
}
